# Name of your application. Used to uniquely configure containers.
service: dougmorgen

# Name of the container image (use your-user/app-name on external registries).
image: douglasmorgen/dougmorgen

# Deploy to these servers.
servers:
  web:
    hosts:
      - 174.127.79.77
    proxy: false
    options:
      publish:
        - "127.0.0.1:3000:80"

# Where you keep your container images.
registry:
  server: ghcr.io
  username: douglasmorgen
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - POSTGRES_PASSWORD
    - SMTP_ADDRESS
    - SMTP_PORT
    - SMTP_DOMAIN
    - SMTP_USERNAME
    - SMTP_PASSWORD
    - INQUIRY_NOTIFICATION_EMAIL
    - ADMIN_USERNAME
    - ADMIN_PASSWORD
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    SOLID_QUEUE_IN_PUMA: true

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Optional local storage volume for Active Storage files.
volumes:
  - "dougmorgen_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404s on in-flight requests.
asset_path: /rails/public/assets

builder:
  arch: amd64

ssh:
  user: root
  port: "25463"

accessories:
  db:
    image: postgres:16
    host: 174.127.79.77
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_DB: dougmorgen_production
        POSTGRES_USER: dougmorgen
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
